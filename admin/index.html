<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B5E20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Адмін — Облік продажів</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div id="app">

  <!-- ═══ HEADER ══════════════════════════════════════════════════════════ -->
  <header class="app-header">
    <button id="btn-back" class="btn-header" hidden>← Назад</button>
    <span class="header-title">Адмін-панель</span>
    <button id="btn-logout" class="btn-header" hidden>Вийти</button>
  </header>

  <!-- ═══ MAIN ════════════════════════════════════════════════════════════ -->
  <main class="app-main">

    <!-- ─── SCREEN: LOGIN ─────────────────────────────────────────────── -->
    <div id="screen-login" class="screen is-active">
      <div class="login-logo">Адмін</div>
      <p class="login-prompt">Введіть PIN адміністратора</p>
      <div class="pin-dots">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>
      <p id="login-error" class="login-error" role="alert"></p>
      <div class="pin-keyboard" role="group" aria-label="Цифрова клавіатура">
        <button class="pin-key" data-value="1">1</button>
        <button class="pin-key" data-value="2">2</button>
        <button class="pin-key" data-value="3">3</button>
        <button class="pin-key" data-value="4">4</button>
        <button class="pin-key" data-value="5">5</button>
        <button class="pin-key" data-value="6">6</button>
        <button class="pin-key" data-value="7">7</button>
        <button class="pin-key" data-value="8">8</button>
        <button class="pin-key" data-value="9">9</button>
        <button class="pin-key pin-key--empty" aria-hidden="true" tabindex="-1"></button>
        <button class="pin-key" data-value="0">0</button>
        <button class="pin-key pin-key--backspace" data-value="del" aria-label="Видалити">⌫</button>
      </div>
    </div>

    <!-- ─── SCREEN: HOME ────────────────────────────────────────────────── -->
    <div id="screen-home" class="screen">
      <div class="home-grid">

        <button class="home-card" data-screen="dashboard">
          <svg class="home-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="12" width="4" height="8" rx="1"/><rect x="9" y="8" width="4" height="12" rx="1"/><rect x="15" y="4" width="4" height="16" rx="1"/>
          </svg>
          <span>Зведення</span>
        </button>

        <button class="home-card" data-screen="expenses">
          <svg class="home-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 21v-16a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16l-3-2-2 2-2-2-2 2-2-2-3 2"/>
            <path d="M14 8h-2.5a1.5 1.5 0 0 0 0 3h1a1.5 1.5 0 0 1 0 3h-2.5m2 0v1.5m0-9v1.5"/>
          </svg>
          <span>Витрати</span>
        </button>

        <button class="home-card" data-screen="inventory">
          <svg class="home-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l8 4.5v9l-8 4.5-8-4.5v-9l8-4.5"/>
            <path d="M12 12l8-4.5M12 12v9M12 12l-8-4.5M8 5.25l8 4.5"/>
          </svg>
          <span>Інвентар</span>
        </button>

        <button class="home-card" data-screen="salary">
          <svg class="home-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M14.8 9a2 2 0 0 0-1.8-1h-2a2 2 0 1 0 0 4h2a2 2 0 1 1 0 4h-2a2 2 0 0 1-1.8-1"/>
            <path d="M12 6v2m0 8v2"/>
          </svg>
          <span>Зарплата</span>
        </button>

        <button class="home-card" data-screen="products">
          <svg class="home-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7v-1a2 2 0 0 1 2-2h2M4 17v1a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v1M16 20h2a2 2 0 0 0 2-2v-1"/>
            <line x1="5" y1="11" x2="5" y2="13"/><line x1="8" y1="11" x2="8" y2="13"/>
            <line x1="11" y1="11" x2="11" y2="13"/><line x1="14" y1="11" x2="14" y2="13"/>
            <line x1="17" y1="11" x2="17" y2="13"/><line x1="20" y1="11" x2="20" y2="13"/>
          </svg>
          <span>Товари</span>
        </button>

        <button class="home-card" data-screen="cash">
          <svg class="home-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 21h18M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1H3l2-4h14l2 4"/>
            <path d="M5 21v-10.15M19 21v-10.15M9 21v-4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4"/>
          </svg>
          <span>Каса</span>
        </button>

        <button class="home-card home-card--wide" data-screen="reports">
          <svg class="home-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
            <path d="M17 21h-10a2 2 0 0 1-2-2v-14a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
            <line x1="9" y1="17" x2="9" y2="12"/><line x1="12" y1="17" x2="12" y2="14"/><line x1="15" y1="17" x2="15" y2="16"/>
          </svg>
          <span>Звіти</span>
        </button>

      </div>
    </div>

    <!-- ─── SCREEN: DASHBOARD ──────────────────────────────────────────── -->
    <div id="screen-dashboard" class="screen">
      <div class="screen-content">

        <!-- Алерти — показуються тільки якщо є -->
        <section id="dash-alerts" hidden>
          <div class="section-title">Увага</div>
          <div id="dash-alert-list" class="flex flex-col gap-sm"></div>
        </section>

        <!-- KPI сьогодні -->
        <div class="section-title">Сьогодні</div>
        <div id="dash-kpi" class="flex flex-col gap"></div>

      </div>
    </div>

    <!-- ─── SCREEN: EXPENSES ───────────────────────────────────────────── -->
    <div id="screen-expenses" class="screen">
      <div class="screen-content">
        <div class="section-title">Витрати на затвердження</div>
        <div id="expenses-list" class="flex flex-col gap"></div>
      </div>
    </div>

    <!-- ─── SCREEN: INVENTORY ──────────────────────────────────────────── -->
    <div id="screen-inventory" class="screen">
      <div class="screen-content">
        <div class="section-title">Інвентаризації</div>
        <div id="inventory-list" class="flex flex-col gap"></div>
      </div>
    </div>

    <!-- ─── SCREEN: SALARY ─────────────────────────────────────────────── -->
    <div id="screen-salary" class="screen">
      <div class="screen-content">
        <div class="section-title">Зарплата</div>
        <div id="salary-list" class="flex flex-col gap"></div>
      </div>
    </div>

    <!-- ─── SCREEN: PRODUCTS ───────────────────────────────────────────── -->
    <div id="screen-products" class="screen">

      <!-- Нові товари від касира (вгорі) -->
      <section id="new-products-section" hidden>
        <div class="section-title">Нові товари від касира</div>
        <div id="new-products-list" class="flex flex-col gap" style="padding:0 var(--gap) var(--gap)"></div>
      </section>

      <!-- Пошук всіх товарів -->
      <div class="section-title">Всі товари</div>
      <div style="padding:0 var(--gap) var(--gap)">
        <input id="product-search"
               class="form-input"
               type="search"
               placeholder="Пошук за назвою або штрихкодом"
               autocomplete="off">
      </div>
      <div id="product-list"></div>
    </div>

    <!-- ─── SCREEN: CASH ─────────────────────────────────────────────── -->
    <div id="screen-cash" class="screen">

      <!-- Поточний баланс -->
      <div style="padding:var(--gap);border-bottom:1px solid var(--border-color)">
        <div class="section-title" style="margin-bottom:4px">Баланс каси</div>
        <div id="cash-balance" class="cash-balance">—</div>
      </div>

      <!-- Форма нового запису -->
      <div style="padding:var(--gap)">
        <form id="cash-entry-form" novalidate>

          <div style="display:flex;gap:var(--gap-sm);margin-bottom:var(--gap-sm)">
            <div class="form-group" style="flex:1">
              <label class="form-label" for="cash-type">Тип</label>
              <select id="cash-type" class="form-select">
                <option value="Прихід">Прихід</option>
                <option value="Витрата">Витрата</option>
              </select>
            </div>
            <div class="form-group" style="flex:1">
              <label class="form-label" for="cash-payment">Оплата</label>
              <select id="cash-payment" class="form-select">
                <option value="Готівка">Готівка</option>
                <option value="Безнал">Безнал</option>
              </select>
            </div>
          </div>

          <div style="display:flex;gap:var(--gap-sm);margin-bottom:var(--gap-sm)">
            <div class="form-group" style="flex:1">
              <label class="form-label" for="cash-amount">Сума (₴)</label>
              <input id="cash-amount" class="form-input" type="number" step="0.01" min="0.01"
                     placeholder="0.00" inputmode="decimal">
            </div>
            <div class="form-group" style="flex:1">
              <label class="form-label" for="cash-shop">Магазин</label>
              <select id="cash-shop" class="form-select">
                <option value="КРЕС">КРЕС</option>
                <option value="Киоск ринок">Киоск ринок</option>
                <option value="Загальне">Загальне</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom:var(--gap-sm)">
            <label class="form-label">Категорія</label>
            <div style="display:flex;gap:8px;align-items:center">
              <select id="cash-category" class="form-select" style="flex:1"></select>
              <button type="button" id="btn-add-cash-category"
                      class="btn btn--outline btn--compact"
                      title="Додати категорію">+</button>
            </div>
          </div>

          <div class="form-group" style="margin-bottom:var(--gap)">
            <label class="form-label" for="cash-desc">Опис</label>
            <input id="cash-desc" class="form-input" type="text" placeholder="Необовʼязково">
          </div>

          <button type="submit" class="btn btn--primary" style="width:100%">Записати</button>
        </form>
      </div>

      <!-- Журнал операцій -->
      <div class="section-title" style="padding:0 var(--gap) var(--gap-sm)">Журнал</div>
      <div id="cash-history" class="flex flex-col gap" style="padding:0 var(--gap) var(--gap)"></div>

      <!-- ─── АДМІН ВИТРАТИ ─────────────────────────────────────────────── -->
      <div style="border-top:1px solid var(--border-color);padding:var(--gap)">
        <div class="section-title" style="margin-bottom:var(--gap-sm)">Адмін витрати</div>
        <form id="admin-expense-form" novalidate>

          <div style="display:flex;gap:var(--gap-sm);margin-bottom:var(--gap-sm)">
            <div class="form-group" style="flex:1">
              <label class="form-label" for="exp-date">Дата</label>
              <input id="exp-date" class="form-input" type="date" required>
            </div>
            <div class="form-group" style="flex:1">
              <label class="form-label" for="exp-amount">Сума (₴)</label>
              <input id="exp-amount" class="form-input" type="number" step="0.01" min="0.01"
                     placeholder="0.00" inputmode="decimal">
            </div>
          </div>

          <div style="display:flex;gap:var(--gap-sm);margin-bottom:var(--gap-sm)">
            <div class="form-group" style="flex:1">
              <label class="form-label" for="exp-category">Категорія</label>
              <select id="exp-category" class="form-select">
                <option value="Оренда">Оренда</option>
                <option value="Податки">Податки</option>
                <option value="Ліцензії">Ліцензії</option>
                <option value="Комунальні">Комунальні</option>
                <option value="Інше">Інше</option>
              </select>
            </div>
            <div class="form-group" style="flex:1">
              <label class="form-label" for="exp-shop">Магазин</label>
              <select id="exp-shop" class="form-select">
                <option value="all">Обидва</option>
                <option value="SHOP_1">КРЕС</option>
                <option value="SHOP_2">Киоск ринок</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom:var(--gap)">
            <label class="form-label" for="exp-desc">Опис</label>
            <textarea id="exp-desc" class="form-input" rows="2"
                      placeholder="Необовʼязково" style="resize:vertical"></textarea>
          </div>

          <button type="submit" class="btn btn--primary" style="width:100%">Записати витрату</button>
        </form>
      </div>

      <!-- Список останніх адмін-витрат -->
      <div class="section-title" style="padding:0 var(--gap) var(--gap-sm)">Останні витрати</div>
      <div id="admin-expense-list" class="flex flex-col gap" style="padding:0 var(--gap) var(--gap)"></div>

    </div>

    <!-- ─── SCREEN: REPORTS ────────────────────────────────────────────── -->
    <div id="screen-reports" class="screen">

      <!-- Фільтр -->
      <form id="report-filter-form" class="filter-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="rep-shop">Магазин</label>
          <select id="rep-shop" class="form-select">
            <option value="all">Обидва</option>
            <option value="shop_1">Магазин №1</option>
            <option value="shop_2">Магазин №2</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="rep-date-from">З дати</label>
          <input id="rep-date-from" class="form-input" type="date" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="rep-date-to">По дату</label>
          <input id="rep-date-to" class="form-input" type="date" required>
        </div>
        <button type="submit" class="btn btn--primary" style="align-self:flex-end">Показати</button>
      </form>

      <!-- Підсумок та таблиця змін -->
      <div id="report-container" class="screen-content" style="padding-top:0"></div>
    </div>

  </main>


</div><!-- /#app -->

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
